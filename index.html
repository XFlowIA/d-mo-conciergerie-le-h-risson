<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Villa Les Embruns — Assistant IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px;
    }
    .chat-wrap {
      display: flex; flex-direction: column;
      width: 100%; max-width: 480px; height: 680px;
      background: #fff; border-radius: 20px; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }
    .chat-header {
      background: #1a6b4a; padding: 16px 18px;
      display: flex; align-items: center; gap: 12px;
    }
    .chat-header-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: white; font-weight: 600; flex-shrink: 0;
    }
    .chat-header-info { flex: 1; }
    .chat-header-name { color: white; font-weight: 600; font-size: 15px; }
    .chat-header-status { color: rgba(255,255,255,0.75); font-size: 12px; margin-top: 2px; }
    .chat-header-badge {
      background: rgba(255,255,255,0.15); color: white; font-size: 11px;
      padding: 4px 10px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.3); white-space: nowrap;
    }
    .scenario-bar {
      padding: 10px 14px; background: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
      display: flex; align-items: center; gap: 8px;
    }
    .scenario-label { font-size: 11px; color: #888; white-space: nowrap; }
    .scenario-select {
      flex: 1; font-size: 12px; border: 1px solid #dee2e6;
      border-radius: 6px; padding: 5px 8px;
      background: white; color: #333; outline: none; cursor: pointer;
    }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      background: #f0f2f5;
    }
    .msg { display: flex; flex-direction: column; max-width: 80%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot  { align-self: flex-start; align-items: flex-start; }
    .msg-bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5; }
    .msg.user .msg-bubble { background: #1a6b4a; color: white; border-bottom-right-radius: 4px; }
    .msg.bot .msg-bubble {
      background: white; color: #222; border: 1px solid #e9ecef;
      border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .msg-time { font-size: 11px; color: #aaa; margin-top: 4px; padding: 0 4px; }
    .typing {
      display: flex; align-items: center; gap: 5px; padding: 12px 16px;
      background: white; border: 1px solid #e9ecef;
      border-radius: 18px; border-bottom-left-radius: 4px; width: fit-content;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #aaa; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} }
    .quick-btns {
      display: flex; gap: 8px; padding: 8px 14px 10px;
      overflow-x: auto; scrollbar-width: none;
      background: white; border-top: 1px solid #f0f0f0;
    }
    .quick-btns::-webkit-scrollbar { display: none; }
    .quick-btn {
      white-space: nowrap; font-size: 12px; padding: 6px 14px;
      border-radius: 20px; border: 1px solid #dee2e6;
      background: #f8f9fa; color: #555; cursor: pointer;
      flex-shrink: 0; transition: all 0.15s;
    }
    .quick-btn:hover { border-color: #1a6b4a; color: #1a6b4a; background: #f0faf5; }
    .chat-input-area {
      padding: 10px 14px 14px; border-top: 1px solid #e9ecef;
      background: white; display: flex; gap: 10px; align-items: flex-end;
    }
    .chat-input {
      flex: 1; border: 1px solid #dee2e6; border-radius: 22px;
      padding: 10px 16px; font-size: 14px; resize: none; outline: none;
      background: #f8f9fa; color: #222; font-family: inherit;
      line-height: 1.4; max-height: 100px; transition: border-color 0.15s;
    }
    .chat-input:focus { border-color: #1a6b4a; background: white; }
    .send-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: #1a6b4a; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: opacity 0.15s;
      box-shadow: 0 2px 8px rgba(26,107,74,0.3);
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-icon { width: 18px; height: 18px; fill: white; }
  </style>
</head>
<body>
<div class="chat-wrap">
  <div class="chat-header">
    <div class="chat-header-avatar">VE</div>
    <div class="chat-header-info">
      <div class="chat-header-name">Villa Les Embruns</div>
      <div class="chat-header-status">Atlantique Conciergerie · La Baule</div>
    </div>
    <span class="chat-header-badge">⚡ IA active</span>
  </div>

  <div class="scenario-bar">
    <span class="scenario-label">Scénario démo :</span>
    <select class="scenario-select" id="scenarioSelect" onchange="loadScenario()">
      <option value="">— choisir un scénario —</option>
      <option value="wifi">Voyageur demande le wifi</option>
      <option value="checkin">Heure d'arrivée & accès</option>
      <option value="chauffage">Problème de chauffage</option>
      <option value="imprevu">Demande imprévue (fer à repasser)</option>
      <option value="urgence">Urgence (panne machine à laver)</option>
      <option value="english">Voyageur anglophone</option>
    </select>
  </div>

  <div class="chat-messages" id="messages">
    <div class="msg bot">
      <div class="msg-bubble">Bonjour ! Je suis l'assistant de la Villa Les Embruns. Comment puis-je vous aider ? 😊</div>
      <span class="msg-time">maintenant</span>
    </div>
  </div>

  <div class="quick-btns">
    <button class="quick-btn" onclick="sendQuick('C\'est quoi le code wifi ?')">📶 Wifi</button>
    <button class="quick-btn" onclick="sendQuick('À quelle heure on peut arriver ?')">🕐 Arrivée</button>
    <button class="quick-btn" onclick="sendQuick('Le chauffage ne fonctionne pas')">🥶 Chauffage</button>
    <button class="quick-btn" onclick="sendQuick('Y a-t-il un fer à repasser ?')">👔 Fer à repasser</button>
    <button class="quick-btn" onclick="sendQuick('La machine à laver est en panne')">🚨 Urgence</button>
    <button class="quick-btn" onclick="sendQuick('What is the wifi password?')">🇬🇧 English</button>
  </div>

  <div class="chat-input-area">
    <textarea class="chat-input" id="msgInput" placeholder="Écrivez un message voyageur..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg class="send-icon" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</div>

<script>
  const WEBHOOK = 'https://n8n.srv1384953.hstgr.cloud/webhook/07680f4a-4948-4c52-80df-24aa479e68a0/chat';

  const scenarios = {
    wifi:      "C'est quoi le code wifi s'il vous plaît ?",
    checkin:   "Bonjour, à quelle heure on peut arriver ? Et comment on accède au logement ?",
    chauffage: "Bonsoir, il fait très froid dans l'appartement, le chauffage ne semble pas fonctionner...",
    imprevu:   "Bonjour, est-ce qu'il y a un fer à repasser dans le logement ?",
    urgence:   "Urgence ! La machine à laver fuit, il y a de l'eau partout !",
    english:   "Hi! What is the wifi password please?"
  };

  function getTime() {
    return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function addMsg(text, type) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.innerHTML = `<div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div><span class="msg-time">${getTime()}</span>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing';
    div.innerHTML = '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function send(text) {
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    addMsg(text, 'user');
    showTyping();
    try {
      const res = await fetch(WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chatInput: text, sessionId: 'demo-session-1' })
      });
      const data = await res.json();
      removeTyping();
      const reply = data.output || data.text || data.message || data.response || data.chatInput || JSON.stringify(data);
      addMsg(reply, 'bot');
    } catch(e) {
      removeTyping();
      addMsg("Je rencontre un problème de connexion. Vérifiez que votre workflow n8n est bien activé.", 'bot');
    }
    btn.disabled = false;
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    await send(text);
  }

  async function sendQuick(text) { await send(text); }

  function loadScenario() {
    const val = document.getElementById('scenarioSelect').value;
    if (val && scenarios[val]) {
      document.getElementById('msgInput').value = scenarios[val];
      document.getElementById('msgInput').focus();
    }
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }
</script>
</body>
</html>
